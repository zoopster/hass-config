
- trigger:
    - platform: homeassistant
      event: start
    - platform: event
      event_type: event_template_reloaded
    - platform: state
      entity_id:
        - weather.p_house_hourly
  sensor:

    - name: Weather Forecast Temperature
      state: >
        {{ state_attr('weather.p_house_hourly', 'forecast')[23].temperature }}
      unit_of_measurement: °C

    - name: Weather Forecast Precipitation
      state: >
        {{ state_attr('weather.p_house_hourly', 'forecast')[23].wind_speed }}

    - name: Weather Forecast Condition
      state: >
        {{ state_attr('weather.p_house_hourly', 'forecast')[23].condition }}

    - name: Weather Forecast Wind Bearing
      state: >
        {{ state_attr('weather.p_house_hourly', 'forecast')[23].wind_bearing }}

    - name: Weather Forecast Wind Speed
      state: >
        {{ state_attr('weather.p_house_hourly', 'forecast')[23].wind_speed }}

    - name: Wind Direction
      state: >
        {% set wind_bearing = state_attr('weather.p_house_hourly', 'wind_bearing') | float(0) %}
        {% if wind_bearing <= 11 or wind_bearing > 348 %}N
        {% elif wind_bearing <= 34 %}NNE
        {% elif wind_bearing <= 56 %}NE
        {% elif wind_bearing <= 79 %}ENE
        {% elif wind_bearing <= 101 %}E
        {% elif wind_bearing <= 124 %}ESE
        {% elif wind_bearing <= 146 %}SE
        {% elif wind_bearing <= 169 %}SSE
        {% elif wind_bearing <= 191 %}S
        {% elif wind_bearing <= 214 %}SSW
        {% elif wind_bearing <= 236 %}SW
        {% elif wind_bearing <= 259 %}WSW
        {% elif wind_bearing <= 281 %}W
        {% elif wind_bearing <= 304 %}WNW
        {% elif wind_bearing <= 326 %}NW
        {% elif wind_bearing <= 348 %}NNW
        {%- endif %}
        
    - name: Wind Strength
      state: >
        {% set wind_speed_mph = states('sensor.p_house_wind') | float(0) * 0.6213712 %}
        {% if wind_speed_mph <= 1 %}No wind
        {% elif wind_speed_mph <= 3 %}Light air
        {% elif wind_speed_mph <= 7 %}Light breeze
        {% elif wind_speed_mph <= 12 %}Gentle breeze
        {% elif wind_speed_mph <= 17 %}Moderate breeze
        {% elif wind_speed_mph <= 24 %}Fresh breeze
        {% elif wind_speed_mph <= 30 %}Strong breeze
        {% elif wind_speed_mph <= 38 %}High wind
        {% elif wind_speed_mph <= 46 %}Fresh gale
        {% elif wind_speed_mph <= 54 %}Strong gale
        {% elif wind_speed_mph <= 63 %}Storm
        {% elif wind_speed_mph <= 72 %}Violent storm
        {% else %}Hurricane
        {%- endif %}

    - name: P-House Hourly Forecast Temperature Rising
      state: >
        {{ iif (state_attr('weather.p_house_hourly', 'temperature') < ((state_attr('weather.p_house_hourly', 'forecast') | map(attribute='temperature') | slice(6) | first() | sum / 4)), 'Rising', 'Falling') }}

    - name: P-House Hourly Forecast Wind Speed Increasing
      state: >
        {{ iif (state_attr('weather.p_house_hourly', 'wind_speed') < ((state_attr('weather.p_house_hourly', 'forecast') | map(attribute='wind_speed') | slice(6) | first() | sum / 4)), 'Increasing', 'Decreasing') }}


- trigger:
    - platform: homeassistant
      event: start
    - platform: event
      event_type: event_template_reloaded
    - platform: state
      entity_id:
        - weather.p_house_2
  sensor:
        
    - name: Accuweather Temperature
      state: >
        {{ state_attr('weather.p_house_2', 'temperature') }}
      unit_of_measurement: °C
      icon: mdi:thermometer

    - name: Accuweather Relative Humidity
      state: >
        {{ state_attr('weather.p_house_2', 'humidity') }}
      unit_of_measurement: '%'
      icon: mdi:water-percent

    - name: Accuweather Ozone
      state: >
        {{ state_attr('weather.p_house_2', 'ozone') }}
      unit_of_measurement: µg/m³
      icon: mdi:molecule

    - name: Accuweather Air Pressure
      state: >
        {{ state_attr('weather.p_house_2', 'pressure') }}
      unit_of_measurement: Pa
      icon: mdi:weather-fog

    - name: Accuweather Wind Speed
      state: >
        {{ states('sensor.p_house_wind') | float * 0.6213712 }}
      unit_of_measurement: mph
      icon: mdi:windsock

    - name: Accuweather Visibility
      state: >
        {{ state_attr('weather.p_house_2', 'visibility') }}
      unit_of_measurement: km
      icon: mdi:weather-hazy


- trigger:
    - platform: homeassistant
      event: start
    - platform: event
      event_type: event_template_reloaded
    - platform: state
      entity_id:
        - group.indoor_temperature_sensors
        - sensor.valhalla_apparent_temperature
    - platform: time_pattern
      minutes: "/1"
  sensor:

    - name: Indoor Average Temperature
      state: >
        {{ expand('group.indoor_temperature_sensors') | rejectattr('state', 'in', ['unavailable', 'unknown']) | map(attribute='state') | map('float') | average | round(1) }}
      unit_of_measurement: °C

    - name: Indoor Outdoor Temperature Difference
      state: >
        {{ (states('sensor.indoor_average_temperature') | float - states('sensor.p_house_apparent_temperature') | float) | round(1) }}
      unit_of_measurement: °C
      attributes:
        description: >
          {{ iif( states('sensor.p_house_apparent_temperature') | float >= states('sensor.indoor_average_temperature') | float, 'cooler', 'warmer') }}


- trigger:
    - platform: homeassistant
      event: start
    - platform: event
      event_type: event_template_reloaded
    - platform: state
      entity_id:
        - group.indoor_humidity_sensors
        - sensor.accuweather_relative_humidity
  sensor:

    - name: Indoor Average Humidity
      state: >
        {{ expand('group.indoor_humidity_sensors') | rejectattr('state', 'in', ['unavailable', 'unknown']) | map(attribute='state') | map('float') | average | round(1) }}
      unit_of_measurement: '%'

    - name: Indoor Outdoor Humidity Difference
      state: >
        {{ (states('sensor.indoor_average_humidity') | float - states('sensor.lr_multisensor_relative_humidity_measurement') | float) | round(1) }}
      unit_of_measurement: '%'
      attributes:
        description: >
          {{ iif( states('sensor.lr_multisensor_relative_humidity_measurement') | float >= states('sensor.indoor_average_humidity') | float, 'drier', 'wetter') }}
