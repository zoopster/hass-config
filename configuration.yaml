lovelace:
  mode: storage
  dashboards:
    lovelace-yaml:
      mode: yaml
      title: YAML
      icon: mdi:script
      show_in_sidebar: true
      filename: ui/ui-lovelace.yaml

default_config:
http:
  server_port: 8124

tts:
  - platform: google_translate

input_number: !include inputs/input_number.yaml
input_datetime: !include inputs/input_datetime.yaml
input_text: !include inputs/input_text.yaml
input_select: !include inputs/input_select.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
frontend:
  themes: !include_dir_merge_named themes
sensor: !include_dir_merge_list sensors
binary_sensor: !include_dir_merge_list binary_sensors
multiscrape: !include_dir_merge_list multiscrape

# Setup REST platform to fix rest sensor issue
rest: !include_dir_merge_list rests

device_tracker:
  - platform: ping
    hosts:
      router: 192.168.50.1
      cloudflare: 1.1.1.1
      sensecap: 192.168.50.164

camera:
  platform: ha_skyfield
  show_constellations: false

logger:
  default: info
