# DASHBOARD
# Maintenance View
# Updated for P-House configuration

title: Maintenance
path: maintenance
icon: mdi:wrench

type: 'custom:grid-layout'
layout: !include snippets/layout-page-margin.yaml

cards:
  - type: 'custom:layout-card'
    layout_type: 'custom:grid-layout'
    layout: !include snippets/layout-page-columns.yaml
    view_layout:
      grid-area: cc
    cards:

      # [Header] Summary
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout: !include snippets/layout-page-title.yaml
        view_layout:
          grid-column: 1/-1
        cards:

          - type: markdown
            style: !include snippets/style-markdown-page-title.yaml
            content: >
              # Maintenance

              Home Assistant is {{ states('update.home_assistant_core_update') }}.
              There are {{ states('sensor.hacs') }} HACS updates available.

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout:
              margin: 0
            view_layout:
              place-self: center start
            cards:
              - type: 'custom:mushroom-entity-card'
                entity: sensor.hacs
                name: HACS Updates
                icon: mdi:alpha-h-box
                icon_color: teal
                style: 'ha-card {background: none;}'


      # [Column] System Updates
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: SYSTEM UPDATES

          - type: 'custom:mushroom-update-card'
            entity: update.home_assistant_core_update
            name: Home Assistant Core
            show_buttons_control: true

          - type: 'custom:mushroom-update-card'
            entity: update.home_assistant_supervisor_update
            name: HA Supervisor
            show_buttons_control: true

          - type: 'custom:mushroom-update-card'
            entity: update.home_assistant_operating_system_update
            name: HA Operating System
            show_buttons_control: true


      # [Column] Router Updates
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: ROUTER UPDATES

          - type: 'custom:mushroom-update-card'
            entity: update.mikrotik_routeros_update
            name: MikroTik RouterOS
            show_buttons_control: true

          - type: 'custom:mushroom-update-card'
            entity: update.mikrotik_routerboard_firmware_update
            name: MikroTik Firmware
            show_buttons_control: true

          - type: 'custom:mushroom-update-card'
            entity: update.mikrotik_office_hap_ac_2_routeros_update
            name: Office AP RouterOS
            show_buttons_control: true


      # [Column] Backup
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: BACKUPS

          - type: 'custom:mushroom-entity-card'
            entity: sensor.backup_backup_manager_state
            name: Backup Manager
            icon: mdi:backup-restore

          - type: 'custom:mushroom-entity-card'
            entity: sensor.backup_last_successful_automatic_backup
            name: Last Backup
            icon: mdi:calendar-check

          - type: 'custom:mushroom-entity-card'
            entity: sensor.backup_next_scheduled_automatic_backup
            name: Next Backup
            icon: mdi:calendar-clock


      # [Column] Battery Status
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: BATTERY STATUS

          - type: 'custom:mushroom-entity-card'
            entity: sensor.back_door_battery
            name: Back Door Sensor
            icon: mdi:battery

          - type: 'custom:mushroom-entity-card'
            entity: sensor.office_switch_battery
            name: Office Switch
            icon: mdi:battery


      # [Column] Network Status
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: NETWORK STATUS

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.ping_cloudflare
            name: Cloudflare (1.1.1.1)
            icon: mdi:cloud

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.ping_google
            name: Google (8.8.8.8)
            icon: mdi:google

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.ping_router
            name: Local Router
            icon: mdi:router-wireless

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.ping_frigate
            name: Frigate NVR
            icon: mdi:cctv


      # [Column] Frigate Status
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: FRIGATE STATUS

          - type: 'custom:mushroom-entity-card'
            entity: sensor.driveway_camera_fps
            name: Driveway FPS
            icon: mdi:video

          - type: 'custom:mushroom-entity-card'
            entity: sensor.driveway_detection_fps
            name: Driveway Detection FPS
            icon: mdi:eye

          - type: 'custom:mushroom-entity-card'
            entity: sensor.backyard_camera_fps
            name: Backyard FPS
            icon: mdi:video

          - type: 'custom:mushroom-entity-card'
            entity: sensor.se_corner_camera_fps
            name: SE Corner FPS
            icon: mdi:video


      # [Column] Device Uptime
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: DEVICE UPTIME

          - type: 'custom:mushroom-entity-card'
            entity: sensor.mikrotik_uptime
            name: Router Uptime
            icon: mdi:router-wireless

          - type: 'custom:mushroom-entity-card'
            entity: sensor.mikrotik_office_hap_ac_2_uptime
            name: Office AP Uptime
            icon: mdi:access-point
