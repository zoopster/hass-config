# DASHBOARD
# Environment View
# Updated for P-House configuration

title: Environment
path: climate
icon: mdi:weather-partly-cloudy

type: 'custom:grid-layout'
layout: !include snippets/layout-page-margin.yaml

cards:
  - type: 'custom:layout-card'
    layout_type: 'custom:grid-layout'
    view_layout:
      grid-area: cc
    layout: !include snippets/layout-page-columns.yaml
    cards:

      # [Header] Summary
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout: !include snippets/layout-page-title.yaml
        view_layout:
          grid-column: 1/-1
        cards:
          - type: markdown
            style: !include snippets/style-markdown-page-title.yaml
            content: >
              # Environment

              It's {{ states('weather.tomorrow_io_p_house_hourly') }} outside.
              Temperature is {{ state_attr('weather.tomorrow_io_p_house_hourly', 'temperature') }}°F
              and feels like {{ states('sensor.tomorrow_io_p_house_feels_like') }}°F.

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout:
              margin: 0
            view_layout:
              place-self: center start
            cards:
              - type: 'custom:mushroom-entity-card'
                entity: weather.tomorrow_io_p_house_hourly
                name: Weather
                icon_color: blue
                style: 'ha-card {background: none;}'

              - type: 'custom:mushroom-entity-card'
                entity: sun.sun
                name: Sun
                icon_color: amber
                style: 'ha-card {background: none;}'


      # [Column] Current Weather
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: CURRENT WEATHER

          - type: weather-forecast
            entity: weather.tomorrow_io_p_house_hourly
            show_forecast: true
            forecast_type: hourly

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_feels_like
            name: Feels Like
            icon: mdi:thermometer

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_dew_point
            name: Dew Point
            icon: mdi:water


      # [Column] Daily Forecast
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: DAILY FORECAST

          - type: weather-forecast
            entity: weather.tomorrow_io_p_house_daily
            show_forecast: true
            forecast_type: daily


      # [Column] Air Quality
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: AIR QUALITY

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_us_epa_air_quality_index
            name: AQI Index
            icon: mdi:air-filter

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_us_epa_health_concern
            name: Health Concern
            icon: mdi:heart-pulse

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_particulate_matter_2_5_mm
            name: PM 2.5
            icon: mdi:blur

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_particulate_matter_10_mm
            name: PM 10
            icon: mdi:blur-radial


      # [Column] Atmospheric
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: ATMOSPHERIC

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_cloud_cover
            name: Cloud Cover
            icon: mdi:cloud

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_pressure_surface_level
            name: Pressure
            icon: mdi:gauge

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_wind_gust
            name: Wind Gust
            icon: mdi:weather-windy


      # [Column] UV & Pollen
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: UV & POLLEN

          - type: 'custom:mushroom-entity-card'
            entity: sensor.current_uv_index
            name: UV Index
            icon: mdi:sun-wireless

          - type: 'custom:mushroom-entity-card'
            entity: sensor.current_uv_level
            name: UV Level
            icon: mdi:sun-wireless-outline

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_grass_pollen_index
            name: Grass Pollen
            icon: mdi:grass

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_tree_pollen_index
            name: Tree Pollen
            icon: mdi:tree

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_weed_pollen_index
            name: Weed Pollen
            icon: mdi:flower-pollen


      # [Column] Sun
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: SUN

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_next_rising
            name: Sunrise
            icon: mdi:weather-sunset-up

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_next_setting
            name: Sunset
            icon: mdi:weather-sunset-down

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_solar_elevation
            name: Elevation
            icon: mdi:angle-acute

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_solar_azimuth
            name: Azimuth
            icon: mdi:compass


      # [Column] Moon
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: MOON

          - type: 'custom:mushroom-entity-card'
            entity: sensor.moon
            name: Current Phase
            icon: mdi:moon-waning-crescent

          - type: 'custom:mushroom-entity-card'
            entity: sensor.next_moon_phase_date
            name: Next Phase
            icon: mdi:calendar-clock


      # [Column] Fire Index
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: FIRE & OZONE

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_fire_index
            name: Fire Index
            icon: mdi:fire

          - type: 'custom:mushroom-entity-card'
            entity: sensor.current_ozone_level
            name: Ozone Level
            icon: mdi:earth

          - type: 'custom:mushroom-entity-card'
            entity: sensor.tomorrow_io_p_house_ozone
            name: Ozone
            icon: mdi:cloud-outline
