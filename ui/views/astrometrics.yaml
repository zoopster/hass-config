# DASHBOARD
# Astrometrics View
# Updated for P-House configuration

title: Astrometrics
path: astrometrics
icon: mdi:rocket-launch

type: 'custom:grid-layout'
layout: !include snippets/layout-page-margin.yaml

cards:
  - type: 'custom:layout-card'
    layout_type: 'custom:grid-layout'
    view_layout:
      grid-area: cc
    layout: !include snippets/layout-page-columns.yaml
    cards:

      # [Header] Summary
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout: !include snippets/layout-page-title.yaml
        view_layout:
          grid-column: 1/-1
        cards:
          - type: markdown
            style: !include snippets/style-markdown-page-title.yaml
            content: >
              # Sol System

              The Sun is {{ states('sun.sun') }}.
              Moon phase: {{ states('sensor.moon') }}.
              Aurora visibility: {{ states('sensor.aurora_visibility_aurora_visibility') }}%.

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout:
              margin: 0
            view_layout:
              place-self: center start
            cards:
              - type: 'custom:mushroom-entity-card'
                entity: sun.sun
                name: Sun
                icon: mdi:white-balance-sunny
                icon_color: amber
                style: 'ha-card {background: none;}'

              - type: 'custom:mushroom-entity-card'
                entity: sensor.moon
                name: Moon
                icon: mdi:moon-waning-crescent
                icon_color: blue
                style: 'ha-card {background: none;}'


      # [Column] ISS Tracking
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: ISS TRACKING

          - type: 'custom:mushroom-entity-card'
            entity: input_datetime.iss_next_overhead_date_time
            name: Next Overhead
            icon: mdi:space-station

          - type: 'custom:mushroom-entity-card'
            entity: input_number.iss_elevation
            name: Elevation
            icon: mdi:angle-acute

          - type: 'custom:mushroom-entity-card'
            entity: input_number.iss_duration
            name: Duration
            icon: mdi:timer

          - type: 'custom:mushroom-entity-card'
            entity: input_text.iss_approach
            name: Approach Direction
            icon: mdi:compass

          - type: 'custom:mushroom-entity-card'
            entity: input_text.iss_departure
            name: Departure Direction
            icon: mdi:compass-outline

          - type: entities
            title: ISS Scripts
            entities:
              - entity: script.iss_overhead_now
                name: ISS Overhead Now
              - entity: script.iss_overhead_in_10_minutes
                name: ISS in 10 Minutes


      # [Column] Solar Activity
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: SOLAR ACTIVITY

          - type: sensor
            entity: sensor.noaa_space_weather_solar_wind_speed
            graph: line
            detail: 2
            name: Solar Wind Speed
            hours_to_show: 24

          - type: sensor
            entity: sensor.noaa_space_weather_solar_wind_magnetic_fields_bt
            graph: line
            detail: 2
            name: Magnetic Field Bt
            hours_to_show: 24

          - type: sensor
            entity: sensor.noaa_space_weather_solar_wind_magnetic_fields_bz
            graph: line
            detail: 2
            name: Magnetic Field Bz
            hours_to_show: 24

          - type: 'custom:mushroom-entity-card'
            entity: sensor.noaa_space_weather_noon_10_7cm_radio_flux
            name: 10.7cm Radio Flux
            icon: mdi:sine-wave


      # [Column] Space Weather Scales
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: SPACE WEATHER SCALES

          - type: entities
            title: Radio Blackout (R)
            entities:
              - entity: sensor.noaa_space_weather_r_latest
                name: Current
              - entity: sensor.noaa_space_weather_r_24hr
                name: 24hr Forecast

          - type: entities
            title: Solar Radiation Storm (S)
            entities:
              - entity: sensor.noaa_space_weather_s_latest
                name: Current
              - entity: sensor.noaa_space_weather_s_24hr
                name: 24hr Forecast

          - type: entities
            title: Geomagnetic Storm (G)
            entities:
              - entity: sensor.noaa_space_weather_g_latest
                name: Current
              - entity: sensor.noaa_space_weather_g_24hr
                name: 24hr Forecast


      # [Column] Forecast
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: FORECAST

          - type: entities
            title: Geomagnetic (G)
            entities:
              - entity: sensor.noaa_space_weather_g_1day
                name: 1-Day
              - entity: sensor.noaa_space_weather_g_2day
                name: 2-Day
              - entity: sensor.noaa_space_weather_g_3day
                name: 3-Day

          - type: entities
            title: Solar Radiation (S)
            entities:
              - entity: sensor.noaa_space_weather_s_1day
                name: 1-Day
              - entity: sensor.noaa_space_weather_s_2day
                name: 2-Day
              - entity: sensor.noaa_space_weather_s_3day
                name: 3-Day


      # [Column] Radio Blackout Probability
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: RADIO BLACKOUT PROB

          - type: entities
            title: Major Flare
            entities:
              - entity: sensor.noaa_space_weather_r_majorprob_1day
                name: 1-Day
              - entity: sensor.noaa_space_weather_r_majorprob_2day
                name: 2-Day
              - entity: sensor.noaa_space_weather_r_majorprob_3day
                name: 3-Day

          - type: entities
            title: Minor Flare
            entities:
              - entity: sensor.noaa_space_weather_r_minorprob_1day
                name: 1-Day
              - entity: sensor.noaa_space_weather_r_minorprob_2day
                name: 2-Day
              - entity: sensor.noaa_space_weather_r_minorprob_3day
                name: 3-Day


      # [Column] Aurora
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: AURORA

          - type: 'custom:mushroom-entity-card'
            entity: sensor.aurora_visibility_aurora_visibility
            name: Aurora Visibility
            icon: mdi:aurora

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.aurora_visibility_aurora_visibility_alert
            name: Aurora Alert
            icon: mdi:alert


      # [Column] Sun Position
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: SUN POSITION

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_solar_elevation
            name: Elevation
            icon: mdi:angle-acute

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_solar_azimuth
            name: Azimuth
            icon: mdi:compass

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_next_rising
            name: Next Sunrise
            icon: mdi:weather-sunset-up

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_next_setting
            name: Next Sunset
            icon: mdi:weather-sunset-down

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_next_dawn
            name: Next Dawn
            icon: mdi:weather-sunset-up

          - type: 'custom:mushroom-entity-card'
            entity: sensor.sun_next_dusk
            name: Next Dusk
            icon: mdi:weather-sunset-down


      # [Column] Moon
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: MOON PHASES

          - type: 'custom:mushroom-entity-card'
            entity: sensor.moon
            name: Current Phase
            icon: mdi:moon-waning-crescent

          - type: 'custom:mushroom-entity-card'
            entity: sensor.next_moon_phase_date
            name: Next Phase
            icon: mdi:calendar

          - type: 'custom:mushroom-entity-card'
            entity: sensor.next_but_one_moon_phase_date
            name: Phase +1
            icon: mdi:calendar

          - type: 'custom:mushroom-entity-card'
            entity: sensor.next_but_two_moon_phase_date
            name: Phase +2
            icon: mdi:calendar

          - type: 'custom:mushroom-entity-card'
            entity: sensor.next_but_three_moon_phase_date
            name: Phase +3
            icon: mdi:calendar
