# DASHBOARD
# Me View
# Updated for P-House configuration

title: Me
path: me
icon: mdi:account

type: 'custom:grid-layout'
layout: !include snippets/layout-page-margin.yaml

cards:
  - type: 'custom:layout-card'
    layout_type: 'custom:grid-layout'
    view_layout:
      grid-area: cc
    layout: !include snippets/layout-page-columns.yaml
    cards:

      # [Header] Summary
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout: !include snippets/layout-page-title.yaml
        view_layout:
          grid-column: 1/-1
        cards:
          - type: markdown
            style: !include snippets/style-markdown-page-title.yaml
            content: >
              # People

              John is {{ states('person.john_pugh') }}.
              Christina is {{ states('person.christina') }}.

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout:
              margin: 0
            view_layout:
              place-self: center start
            cards:
              - type: 'custom:mushroom-person-card'
                entity: person.john_pugh
                icon_type: entity-picture
                style: 'ha-card {background: none;}'

              - type: 'custom:mushroom-person-card'
                entity: person.christina
                icon_type: entity-picture
                style: 'ha-card {background: none;}'


      # [Column] John's Devices
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: JOHN'S DEVICES

          - type: 'custom:mushroom-entity-card'
            entity: device_tracker.johns_macbook_pro_2
            name: MacBook Pro
            icon: mdi:laptop

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.johns_macbook_pro_2_active
            name: MacBook Active
            icon: mdi:laptop

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.johns_macbook_pro_2_focus
            name: MacBook Focus
            icon: mdi:bell-off

          - type: 'custom:mushroom-entity-card'
            entity: device_tracker.jpip
            name: iPhone
            icon: mdi:cellphone

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.jpip_focus
            name: iPhone Focus
            icon: mdi:bell-off

          - type: 'custom:mushroom-entity-card'
            entity: device_tracker.ipad
            name: iPad
            icon: mdi:tablet


      # [Column] MacBook Status
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: MACBOOK STATUS

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.johns_macbook_pro_2_camera_in_use
            name: Camera In Use
            icon: mdi:camera

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.johns_macbook_pro_2_audio_input_in_use
            name: Microphone In Use
            icon: mdi:microphone

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.johns_macbook_pro_2_audio_output_in_use
            name: Audio Playing
            icon: mdi:volume-high


      # [Column] Christina's Devices
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: CHRISTINA'S DEVICES

          - type: 'custom:mushroom-entity-card'
            entity: device_tracker.kfrawi
            name: Phone
            icon: mdi:cellphone

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.kfrawi_is_charging
            name: Charging
            icon: mdi:battery-charging

          - type: 'custom:mushroom-entity-card'
            entity: sensor.kfrawi_battery_power
            name: Battery Power
            icon: mdi:battery


      # [Column] Fans
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: FANS

          - type: 'custom:mushroom-fan-card'
            entity: fan.office_fan
            name: Office Fan
            icon_animation: true
            show_percentage_control: true
            collapsible_controls: true

          - type: 'custom:mushroom-fan-card'
            entity: fan.queens_fan
            name: Queen's Fan
            icon_animation: true
            show_percentage_control: true
            collapsible_controls: true


      # [Column] Buzzers
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: BUZZERS

          - type: 'custom:mushroom-entity-card'
            entity: switch.buzzer_bedroom
            name: Bedroom Buzzer
            icon: mdi:bell-ring
            tap_action:
              action: toggle

          - type: 'custom:mushroom-entity-card'
            entity: switch.buzzer_office
            name: Office Buzzer
            icon: mdi:bell-ring
            tap_action:
              action: toggle


      # [Column] Pool Bath
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: POOL BATH

          - type: 'custom:mushroom-entity-card'
            entity: switch.pool_bath_light
            name: Light
            icon: mdi:lightbulb
            tap_action:
              action: toggle

          - type: 'custom:mushroom-entity-card'
            entity: switch.pool_bath_fan
            name: Fan
            icon: mdi:fan
            tap_action:
              action: toggle
