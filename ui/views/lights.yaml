# DASHBOARD
# Lights View
# Updated for P-House configuration

title: Lights
path: lights
icon: mdi:lightbulb-group

type: 'custom:grid-layout'
layout: !include snippets/layout-page-margin.yaml

cards:
  - type: 'custom:layout-card'
    layout_type: 'custom:grid-layout'
    layout: !include snippets/layout-page-columns.yaml
    view_layout:
      grid-area: cc
    cards:

      # [Header] Summary
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout: !include snippets/layout-page-title.yaml
        view_layout:
          grid-column: 1/-1
        cards:

          - type: markdown
            style: !include snippets/style-markdown-page-title.yaml
            content: >
              # Lights

              {% set lights_on = states.light|selectattr('state','equalto','on')|list|length %}
              {% set lights_total = states.light|length %}
              You have {{ lights_total }} lights and {{ lights_on }}
              of them {{ iif(lights_on == 1, 'is', 'are') }} turned on.

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout:
              margin: 0
            view_layout:
              place-self: center start
            cards:
              - type: 'custom:mushroom-entity-card'
                entity: light.bedroom
                name: Bedroom
                icon_color: amber
                style: 'ha-card {background: none;}'
                tap_action:
                  action: toggle

              - type: 'custom:mushroom-entity-card'
                entity: light.living_room
                name: Living Room
                icon_color: amber
                style: 'ha-card {background: none;}'
                tap_action:
                  action: toggle


      # [Column] Living Room
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: LIVING ROOM

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout: !include snippets/layout-live-tile.yaml
            cards: !include columns/lights-living-room.yaml


      # [Column] Bedroom
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: BEDROOM
            view_layout:
              grid-column: 1/-1

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout: !include snippets/layout-live-tile.yaml
            cards: !include columns/lights-bedroom.yaml


      # [Column] Office
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: OFFICE

          - type: 'custom:mushroom-light-card'
            entity: light.office
            name: Office Light
            use_light_color: true
            show_brightness_control: true
            show_color_control: true


      # [Column] Outside
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: OUTSIDE

          - type: 'custom:mushroom-light-card'
            entity: light.pole_light
            name: Pole Light
            show_brightness_control: true

          - type: 'custom:mushroom-light-card'
            entity: light.se_corner
            name: SE Corner
            show_brightness_control: true

          - type: 'custom:mushroom-light-card'
            entity: light.front_entrance
            name: Front Entrance
            show_brightness_control: true

          - type: 'custom:mushroom-light-card'
            entity: light.ne_corner
            name: NE Corner
            show_brightness_control: true
