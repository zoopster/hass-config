# DASHBOARD
# Energy View
# Updated for P-House configuration

title: Energy
path: 'energy'
icon: mdi:flash

type: 'custom:grid-layout'
layout: !include snippets/layout-page-margin.yaml

cards:
  - type: 'custom:layout-card'
    layout_type: 'custom:grid-layout'
    view_layout:
      grid-area: cc
    layout: !include snippets/layout-page-columns.yaml
    cards:

      # [Header] Summary
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout: !include snippets/layout-page-title.yaml
        view_layout:
          grid-column: 1/-1
        cards:

          - type: markdown
            style: !include snippets/style-markdown-page-title.yaml
            content: >
              # Energy

              Current power usage is {{ states('sensor.emon_total_watts') }} watts.
              Your projected bill is ${{ states('sensor.fpl_4362074298_projected_bill') }}.

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout:
              margin: 0
            view_layout:
              place-self: center start
            cards:
              - type: 'custom:mushroom-entity-card'
                entity: sensor.emon_total_watts
                name: Total Power
                icon: mdi:flash
                icon_color: amber
                style: 'ha-card {background: none;}'

              - type: 'custom:mushroom-entity-card'
                entity: sensor.fpl_4362074298_bill_to_date
                name: Bill to Date
                icon: mdi:currency-usd
                icon_color: green
                style: 'ha-card {background: none;}'


      # [Column] Current Usage
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: CURRENT USAGE

          - type: sensor
            entity: sensor.emon_total_watts
            graph: line
            detail: 2
            name: Total Watts
            hours_to_show: 24

          - type: sensor
            entity: sensor.emon_total_kwh
            graph: line
            detail: 2
            name: Total kWh
            hours_to_show: 24

          - type: sensor
            entity: sensor.emon_volts_a
            graph: line
            detail: 2
            name: Voltage


      # [Column] FPL Billing
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: FPL BILLING

          - type: entities
            entities:
              - entity: sensor.fpl_4362074298_bill_to_date
                name: Bill to Date
              - entity: sensor.fpl_4362074298_projected_bill
                name: Projected Bill
              - entity: sensor.fpl_4362074298_balance_due
                name: Balance Due
              - entity: sensor.fpl_4362074298_balance_due_date
                name: Due Date
              - entity: sensor.fpl_4362074298_daily_average
                name: Daily Average Cost

          - type: sensor
            entity: sensor.fpl_4362074298_daily_usage_kwh
            graph: line
            detail: 2
            name: Daily Usage kWh


      # [Column] FPL Usage by Category
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: USAGE BY CATEGORY

          - type: entities
            entities:
              - entity: sensor.fpl_4362074298_cooling_cost
                name: Cooling
                icon: mdi:snowflake
              - entity: sensor.fpl_4362074298_water_heater_cost
                name: Water Heater
                icon: mdi:water-boiler
              - entity: sensor.fpl_4362074298_refrigeration_cost
                name: Refrigeration
                icon: mdi:fridge
              - entity: sensor.fpl_4362074298_laundry_cost
                name: Laundry
                icon: mdi:washing-machine
              - entity: sensor.fpl_4362074298_cooking_cost
                name: Cooking
                icon: mdi:stove
              - entity: sensor.fpl_4362074298_lighting_cost
                name: Lighting
                icon: mdi:lightbulb
              - entity: sensor.fpl_4362074298_entertainment_cost
                name: Entertainment
                icon: mdi:television
              - entity: sensor.fpl_4362074298_pool_cost
                name: Pool
                icon: mdi:pool
              - entity: sensor.fpl_4362074298_miscellaneous_cost
                name: Miscellaneous
                icon: mdi:dots-horizontal


      # [Column] Main Circuits
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: MAIN CIRCUITS

          - type: sensor
            entity: sensor.emon_total_watts_main
            graph: line
            detail: 2
            name: Main Panel
            hours_to_show: 24

          - type: sensor
            entity: sensor.emon_total_watts_add_on
            graph: line
            detail: 2
            name: Add-On Panel
            hours_to_show: 24

          - type: sensor
            entity: sensor.emon_ct2_mainl_watts
            graph: line
            detail: 2
            name: CT2 Main L
            hours_to_show: 24


      # [Column] Individual Circuits
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: INDIVIDUAL CIRCUITS

          - type: sensor
            entity: sensor.emon_ct1_watts
            graph: line
            detail: 2
            name: CT1
            hours_to_show: 12

          - type: sensor
            entity: sensor.emon_ct3_watts
            graph: line
            detail: 2
            name: CT3
            hours_to_show: 12

          - type: sensor
            entity: sensor.emon_ct4_watts
            graph: line
            detail: 2
            name: CT4
            hours_to_show: 12


      # [Column] Water Heater Circuits
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: WATER HEATER

          - type: sensor
            entity: sensor.emon_ct5_h2or_watts
            graph: line
            detail: 2
            name: H2O Right
            hours_to_show: 24

          - type: sensor
            entity: sensor.emon_ct6_h2ol_watts
            graph: line
            detail: 2
            name: H2O Left
            hours_to_show: 24


      # [Column] Appliances
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: APPLIANCES

          - type: 'custom:mushroom-entity-card'
            entity: sensor.refrigerator_power
            name: Refrigerator Power
            icon: mdi:fridge

          - type: sensor
            entity: sensor.refrigerator_energy
            graph: line
            detail: 2
            name: Refrigerator Energy
            hours_to_show: 24

          - type: 'custom:mushroom-entity-card'
            entity: sensor.dishwasher_operation_state
            name: Dishwasher Status
            icon: mdi:dishwasher

          - type: 'custom:mushroom-entity-card'
            entity: sensor.dryer_current_status
            name: Dryer Status
            icon: mdi:tumble-dryer
