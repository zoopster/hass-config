# DASHBOARD
# Network View
# Updated for P-House configuration

title: Network
path: 'network'
icon: mdi:lan

type: 'custom:grid-layout'
layout: !include snippets/layout-page-margin.yaml

cards:
  - type: 'custom:layout-card'
    layout_type: 'custom:grid-layout'
    view_layout:
      grid-area: cc
    layout: !include snippets/layout-page-columns.yaml
    cards:

      # [Header] Summary
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout: !include snippets/layout-page-title.yaml
        view_layout:
          grid-column: 1/-1
        cards:
          - type: markdown
            style: !include snippets/style-markdown-page-title.yaml
            content: >
              # Network

              The Internet is {{ states('binary_sensor.ping_cloudflare') }}
              and {{ states('sensor.mikrotik_wired_clients') }} devices
              are connected to the router.

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout:
              margin: 0
            view_layout:
              place-self: center start
            cards:
              - type: 'custom:mushroom-entity-card'
                entity: binary_sensor.ping_cloudflare
                name: WAN Status
                icon_color: pink
                style: 'ha-card {background: none;}'

              - type: 'custom:mushroom-entity-card'
                entity: sensor.mikrotik_wired_clients
                name: Router Clients
                icon: 'mdi:router-wireless'
                icon_color: pink
                style: 'ha-card {background: none;}'


      # [Column] Connection Status
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: CONNECTION STATUS

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.ping_cloudflare
            name: Cloudflare (1.1.1.1)
            icon: mdi:cloud

          - type: 'custom:mushroom-entity-card'
            entity: binary_sensor.ping_router
            name: Local Router
            icon: mdi:router-wireless


      # [Column] Download Speed
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: WAN DOWNLOAD

          - type: sensor
            entity: sensor.speedtest_download
            graph: line
            detail: 2
            name: Speedtest Download

          - type: sensor
            entity: sensor.mikrotik_wan_rx
            graph: line
            detail: 2
            name: Router Download
            hours_to_show: 24


      # [Column] Upload Speed
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: WAN UPLOAD

          - type: sensor
            entity: sensor.speedtest_upload
            graph: line
            detail: 2
            name: Speedtest Upload

          - type: sensor
            entity: sensor.mikrotik_wan_tx
            graph: line
            detail: 2
            name: Router Upload
            hours_to_show: 24


      # [Column] Ping
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: PING

          - type: sensor
            entity: sensor.speedtest_ping
            graph: line
            detail: 2
            hours_to_show: 24

          - type: 'custom:uptime-card'
            entity: binary_sensor.ping_cloudflare
            color:
              none: null
            bar:
              round: 0
              height: 48
              spacing: 4
            alias:
              ok: Connected
              ko: Disconnected


      # [Column] Router Stats
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: P-HOUSE ROUTER

          - type: sensor
            entity: sensor.mikrotik_cpu_load
            graph: line
            detail: 2
            name: CPU Load

          - type: sensor
            entity: sensor.mikrotik_memory_usage
            graph: line
            detail: 2
            name: Memory Usage

          - type: sensor
            entity: sensor.mikrotik_wired_clients
            graph: line
            detail: 2
            name: Connected Devices


      # [Column] LAN Traffic
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: LAN TRAFFIC

          - type: sensor
            entity: sensor.mikrotik_ether4_rx
            graph: line
            detail: 2
            name: Ether4 RX

          - type: sensor
            entity: sensor.mikrotik_ether4_tx
            graph: line
            detail: 2
            name: Ether4 TX

          - type: sensor
            entity: sensor.mikrotik_ether5_rx
            graph: line
            detail: 2
            name: Ether5 RX

          - type: sensor
            entity: sensor.mikrotik_ether5_tx
            graph: line
            detail: 2
            name: Ether5 TX


      # [Column] Connected Devices
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: CONNECTED DEVICES

          - type: custom:auto-entities
            filter:
              include:
                - domain: device_tracker
                  integration: mikrotik
                  state: home
                  options:
                    type: custom:mushroom-entity-card
                    icon_color: green
              exclude: []
            card:
              type: vertical-stack
            sort:
              method: friendly_name
