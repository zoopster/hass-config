                    entity: sensor.p_house_wind
                    name: '[[[ return states["sensor.wind_strength"].state ]]]'
                    icon: 'mdi:navigation'
                    label: '[[[ return states["sensor.wind_direction"].state ]]]'
                    state_display: '[[[ return Math.round(parseFloat(states["sensor.p_house_wind"].state) * 0.6213712 * 10) / 10 ]]]'
                    custom_fields:
                      unit: MPH
                    styles:
                      grid:
                        - background: var(--ha-card-background)
                      card:
                        - background: |
                            [[[
                              var wind_speed_mph = parseFloat(states["sensor.p_house_wind"].state) * 0.6213712
                              if (wind_speed_mph <= 30) { return "transparent" }
                              if (wind_speed_mph <= 54) {
                                return "rgba(var(--rgb-primary-color)," + (wind_speed_mph / 54) + ")"
                              } else {
                                return "var(--accent-color)"
                              }
                            ]]]
                      icon:
                        - transform: '[[[ return "rotate(" + parseFloat(states["weather.p_house_hourly"].attributes.wind_bearing) + "deg)" ]]]'


