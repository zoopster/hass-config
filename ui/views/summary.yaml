# DASHBOARD
# Summary View
# Updated for P-House configuration

title: Summary
icon: 'mdi:home-circle'
path: 'summary'

type: 'custom:grid-layout'
layout: !include snippets/layout-page-margin.yaml

cards:
  - type: 'custom:layout-card'
    layout_type: 'custom:grid-layout'
    layout: !include snippets/layout-page-columns.yaml
    view_layout:
      grid-area: cc
    cards:

      # [Header] Summary
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout: !include snippets/layout-page-title.yaml
        view_layout:
          grid-column: 1/-1
        cards:

          - type: markdown
            style: !include snippets/style-markdown-page-title.yaml
            content: >
              # Welcome Home

              {% set lights_on = states.light|selectattr('state','equalto','on')|list|length %}
              {% set temp = states('sensor.p_house_temperature') %}
              {% set condition = states('weather.p_house_hourly') %}
              It's {{ condition }} and {{ temp }}°F outside.
              You have {{ lights_on }} light{{ iif(lights_on != 1, 's', '') }} on.

          - type: 'custom:layout-card'
            layout_type: 'custom:grid-layout'
            layout:
              margin: 0
            view_layout:
              place-self: center start
            cards:
              - type: 'custom:mushroom-person-card'
                entity: person.john_pugh
                icon_type: entity-picture
                style: 'ha-card {background: none;}'

              - type: 'custom:mushroom-person-card'
                entity: person.christina
                icon_type: entity-picture
                style: 'ha-card {background: none;}'


      # [Column] Weather
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: WEATHER

          - type: weather-forecast
            entity: weather.p_house_hourly
            show_forecast: true
            forecast_type: hourly

          - type: 'custom:mushroom-entity-card'
            entity: sensor.p_house_temperature
            name: Temperature
            icon_color: orange

          - type: 'custom:mushroom-entity-card'
            entity: sensor.p_house_humidity
            name: Humidity
            icon_color: blue

          - type: 'custom:mushroom-entity-card'
            entity: sensor.p_house_wind
            name: Wind Speed
            icon_color: cyan


      # [Column] Quick Controls
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: QUICK CONTROLS

          - type: 'custom:mushroom-light-card'
            entity: light.living_room
            name: Living Room
            use_light_color: true
            show_brightness_control: true
            collapsible_controls: true

          - type: 'custom:mushroom-light-card'
            entity: light.bedroom
            name: Bedroom
            use_light_color: true
            show_brightness_control: true
            collapsible_controls: true

          - type: 'custom:mushroom-light-card'
            entity: light.office
            name: Office
            use_light_color: true
            show_brightness_control: true
            collapsible_controls: true


      # [Column] Outside Lights
      - type: 'custom:layout-card'
        layout_type: 'custom:grid-layout'
        layout:
          margin: -1
        cards:

          - type: 'custom:button-card'
            template: header_card_no_link
            variables:
              name: OUTSIDE LIGHTS

          - type: 'custom:mushroom-light-card'
            entity: light.pole_light
            name: Pole Light
            show_brightness_control: true

